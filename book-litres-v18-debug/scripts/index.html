<!doctype html><html><head><meta charset="utf-8"><title>LitRes v18 debug</title></head><body><script>
"use strict";
const PROXY="https://litres-proxy-worker.adovzhenko.workers.dev";
function p(data){if(data&&typeof data==='object')return data;try{return JSON.parse(String(data||'{}'));}catch{return {};}}
async function get(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});const tx=await r.text();return{http:r.status,text:tx};}catch(e){return{http:0,text:(e&&e.name?e.name:'Error')+': '+(e&&e.message?e.message:String(e))};}finally{clearTimeout(t);}}
window['ai_edge_gallery_get_result']=async(data)=>{const i=p(data);const title=String(i.title||'').trim(),author=String(i.author||'').trim();const search=await get(PROXY+'/?mode=search&q='+encodeURIComponent([title,author].filter(Boolean).join(' ')),15000);let bookUrl='';const m=search.text.match(/https:\/\/www\.litres\.ru\/book\/[^"'< >]+\/?/i)||search.text.match(/\/book\/[^"'< >]+\/?/i);if(m)bookUrl=m[0].startsWith('http')?m[0]:'https://www.litres.ru'+m[0];if(!bookUrl)return JSON.stringify({result:'BOOK_URL_NOT_FOUND'});const page=await get(PROXY+'/?mode=page&url='+encodeURIComponent(bookUrl),18000);const html=page.text;let s=html.replace(/<script\b[\s\S]*?<\/script>/gi,'\n').replace(/<style\b[\s\S]*?<\/style>/gi,'\n').replace(/<(?:br|hr)\b[^>]*>/gi,'\n').replace(/<\/(?:p|div|section|article|li|h1|h2|h3|h4|h5|h6|a|button|span)>/gi,'\n').replace(/<[^>]+>/g,' ');s=s.replace(/&quot;|&#34;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;|&#160;/g,' ').replace(/\r/g,'\n');const lines=s.split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);let idx=lines.findIndex(x=>/^Отзывы/i.test(x));if(idx<0)idx=lines.findIndex(x=>/Сначала популярные/i.test(x));if(idx<0)idx=0;const from=Math.max(0,idx-8),to=Math.min(lines.length,idx+80);const out=lines.slice(from,to).map((x,j)=>String(from+j).padStart(4,'0')+': '+x).join('\n');return JSON.stringify({result:'URL='+bookUrl+'\nLINES\n'+out});};
</script></body></html>
