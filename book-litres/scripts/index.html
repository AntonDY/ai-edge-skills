<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book LitRes v4 Mini Debug</title>
</head>
<body>
<script>
"use strict";

const TIMEOUT_MS = 20000;

function clean(s) {
  return String(s || "").replace(/\s+/g, " ").trim();
}

async function fetchText(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      headers: {
        "Accept": "text/plain, text/markdown;q=0.9, text/html;q=0.8, */*;q=0.1"
      }
    });

    const text = await response.text();

    return {
      ok: response.ok,
      status: response.status,
      finalUrl: response.url || url,
      text
    };
  } finally {
    clearTimeout(timer);
  }
}

window["ai_edge_gallery_get_result"] = async function(data) {
  try {
    const input = typeof data === "string" ? JSON.parse(data) : data;

    const title = clean(input && input.title);
    const author = clean(input && input.author);

    const query =
      'site:litres.ru/book/ "' +
      title +
      '" "' +
      author +
      '"';

    const bingUrl =
      "https://www.bing.com/search?q=" +
      encodeURIComponent(query);

    const readerUrl =
      "https://r.jina.ai/" + bingUrl;

    const res = await fetchText(readerUrl);
    const body = String(res.text || "");
    const lower = body.toLowerCase();

    const hasLitres = lower.includes("litres.ru");
    const hasBook = lower.includes("/book/");
    const hasAuthor = lower.includes("маркелов");
    const hasKubernetes = lower.includes("kubernetes");
    const hasTitleRu = lower.includes("введение в технологии контейнеров");

    const result = [
      "DEBUG_OK",
      "HTTP=" + res.status,
      "OK=" + (res.ok ? "YES" : "NO"),
      "LEN=" + body.length,
      "HAS_LITRES=" + (hasLitres ? "YES" : "NO"),
      "HAS_BOOK=" + (hasBook ? "YES" : "NO"),
      "HAS_AUTHOR=" + (hasAuthor ? "YES" : "NO"),
      "HAS_KUBERNETES=" + (hasKubernetes ? "YES" : "NO"),
      "HAS_TITLE_RU=" + (hasTitleRu ? "YES" : "NO")
    ].join("\n");

    return JSON.stringify({
      result
    });

  } catch (e) {
    return JSON.stringify({
      result:
        "DEBUG_FAIL\nERROR=" +
        (e && e.message ? e.message : String(e))
    });
  }
};

</script>
</body>
</html>
