<!doctype html>
<meta charset="utf-8">
<script>
const clean=s=>String(s||"").replace(/\s+/g," ").trim();

async function txt(url){
  const r=await fetch("https://r.jina.ai/"+url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.text();
}

function links(md){
  const a=[], seen=new Set();
  const re=/\[([^\]]+)\]\((https?:\/\/(?:www\.)?litres\.ru\/book\/[^)\s]+)\)/g;
  let m;

  while((m=re.exec(md))){
    let u=m[2]
      .split("#")[0]
      .split("?")[0]
      .replace(/\/reviews\/?$/,"/")
      .replace(/\/?$/,"/");

    if(!seen.has(u)){
      seen.add(u);
      a.push({name:clean(m[1]),url:u});
    }
  }
  return a;
}

window.ai_edge_gallery_get_result=async(data)=>{
  try{
    const x=JSON.parse(data||"{}");
    const title=clean(x.title);
    const author=clean(x.author);
    const isbn=clean(x.isbn);

    if(!title&&!isbn){
      return JSON.stringify({
        error:"Не удалось определить название или ISBN."
      });
    }

    const q='site:litres.ru/book/ '+
      [title,author,isbn]
        .filter(Boolean)
        .map(v=>'"'+v.replace(/"/g,"")+'"')
        .join(" ");

    const serp=await txt(
      "https://www.bing.com/search?q="+encodeURIComponent(q)
    );

    const found=links(serp);

    if(!found.length){
      return JSON.stringify({
        result:"Страница книги на LitRes не найдена. Не придумывай рейтинг или отзывы."
      });
    }

    const best=found[0];
    const reviews=best.url.replace(/\/$/,"")+"/reviews/";

    const pages=await Promise.allSettled([
      txt(best.url),
      txt(reviews)
    ]);

    const book=
      pages[0].status==="fulfilled" ? pages[0].value : "";

    const rev=
      pages[1].status==="fulfilled" ? pages[1].value : "";

    return JSON.stringify({
      result:[
        "Запрос: "+title+" — "+author,
        "LitRes: "+best.url,
        "Отзывы: "+reviews,
        "",
        "Данные страницы книги:",
        book.slice(0,6500),
        "",
        "Данные страницы отзывов:",
        rev.slice(0,7500),
        "",
        "Используй только приведенные данные; ничего не выдумывай."
      ].join("\n")
    });

  }catch(e){
    return JSON.stringify({
      error:"Ошибка поиска LitRes: "+e.message
    });
  }
};
</script>
