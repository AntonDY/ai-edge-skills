<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book LitRes Link Debug</title>
</head>
<body>
<script>
"use strict";

const TIMEOUT_MS = 20000;
const CONTEXT_BEFORE = 350;
const CONTEXT_AFTER = 700;
const MAX_MATCHES_PER_TERM = 8;
const MAX_TOTAL = 24000;

function clean(s) {
  return String(s || "").replace(/\s+/g, " ").trim();
}

async function fetchText(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      headers: {
        "Accept": "text/plain, text/markdown;q=0.9, text/html;q=0.8, */*;q=0.1"
      }
    });

    const text = await response.text();

    return {
      ok: response.ok,
      status: response.status,
      finalUrl: response.url || url,
      text
    };
  } finally {
    clearTimeout(timer);
  }
}

function contextsAround(text, needle, label) {
  const out = [];
  const lower = text.toLowerCase();
  const target = needle.toLowerCase();

  let from = 0;
  let count = 0;

  while (count < MAX_MATCHES_PER_TERM) {
    const idx = lower.indexOf(target, from);
    if (idx < 0) break;

    const start = Math.max(0, idx - CONTEXT_BEFORE);
    const end = Math.min(text.length, idx + target.length + CONTEXT_AFTER);

    out.push(
      [
        `--- ${label} MATCH ${count + 1} ---`,
        `index=${idx}`,
        text.slice(start, end),
        ""
      ].join("\n")
    );

    count++;
    from = idx + target.length;
  }

  return out;
}

function uniqueSections(sections) {
  const seen = new Set();
  const out = [];

  for (const s of sections) {
    const key = s.slice(0, 1000);
    if (!seen.has(key)) {
      seen.add(key);
      out.push(s);
    }
  }

  return out;
}

window["ai_edge_gallery_get_result"] = async function(data) {
  try {
    const input = typeof data === "string" ? JSON.parse(data) : data;

    const title = clean(input && input.title);
    const author = clean(input && input.author);

    const query =
      'site:litres.ru/book/ "' +
      title +
      '" "' +
      author +
      '"';

    const bingUrl =
      "https://www.bing.com/search?q=" +
      encodeURIComponent(query);

    const readerUrl =
      "https://r.jina.ai/" + bingUrl;

    const res = await fetchText(readerUrl);
    const body = String(res.text || "");

    let sections = [];

    sections.push(...contextsAround(body, "litres.ru", "litres.ru"));
    sections.push(...contextsAround(body, "/book/", "/book/"));
    sections.push(...contextsAround(body, "Маркелов", "author"));
    sections.push(...contextsAround(body, "Kubernetes", "title"));
    sections.push(...contextsAround(body, "Введение в технологии контейнеров", "title-ru"));

    sections = uniqueSections(sections);

    const result = [
      "DEBUG LINK CONTEXT",
      "",
      "INPUT",
      "title: " + title,
      "author: " + author,
      "",
      "HTTP",
      "ok: " + res.ok,
      "status: " + res.status,
      "finalUrl: " + res.finalUrl,
      "responseLength: " + body.length,
      "",
      "SEARCH URL",
      bingUrl,
      "",
      "MATCH SECTIONS FOUND: " + sections.length,
      "",
      ...(sections.length ? sections : ["(no matching contexts found)"]),
      "",
      "END DEBUG LINK CONTEXT"
    ].join("\n");

    return JSON.stringify({
      result: result.slice(0, MAX_TOTAL)
    });

  } catch (e) {
    return JSON.stringify({
      result: [
        "DEBUG LINK CONTEXT",
        "",
        "ERROR",
        e && e.stack ? e.stack : String(e),
        "",
        "END DEBUG LINK CONTEXT"
      ].join("\n")
    });
  }
};

</script>
</body>
</html>
