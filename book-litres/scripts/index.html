<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book LitRes Raw Debug</title>
</head>
<body>
<script>
"use strict";

const TIMEOUT_MS = 20000;
const MAX_BODY = 10000;

function clean(s) {
  return String(s || "").replace(/\s+/g, " ").trim();
}

function normalizeIsbn(s) {
  const value = clean(s);
  if (!value) return "";

  const bad = new Set([
    "n/a","na","none","null","unknown",
    "нет","неизвестно","-"
  ]);

  if (bad.has(value.toLowerCase())) return "";

  const compact = value.replace(/[^0-9Xx]/g, "");
  if (compact.length !== 10 && compact.length !== 13) return "";

  return compact;
}

async function fetchWithTimeout(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      headers: {
        "Accept": "text/plain, text/markdown;q=0.9, text/html;q=0.8, */*;q=0.1"
      }
    });

    const text = await response.text();

    return {
      ok: response.ok,
      status: response.status,
      finalUrl: response.url || url,
      text
    };

  } finally {
    clearTimeout(timer);
  }
}

window["ai_edge_gallery_get_result"] = async function(data) {
  try {
    const input = typeof data === "string" ? JSON.parse(data) : data;

    const title = clean(input && input.title);
    const author = clean(input && input.author);
    const isbn = normalizeIsbn(input && input.isbn);

    const q =
      'site:litres.ru/book/ "' +
      title +
      '" "' +
      author +
      '"';

    const bingUrl =
      "https://www.bing.com/search?q=" +
      encodeURIComponent(q);

    const readerUrl =
      "https://r.jina.ai/" + bingUrl;

    let lines = [
      "DEBUG BOOK-LITRES",
      "",
      "INPUT",
      "title: " + (title || "(empty)"),
      "author: " + (author || "(empty)"),
      "isbn: " + (isbn || "(empty)"),
      "",
      "SEARCH QUERY",
      q,
      "",
      "BING URL",
      bingUrl,
      "",
      "JINA READER URL",
      readerUrl,
      ""
    ];

    try {
      const res = await fetchWithTimeout(readerUrl);

      lines.push(
        "HTTP RESULT",
        "ok: " + res.ok,
        "status: " + res.status,
        "finalUrl: " + res.finalUrl,
        "responseLength: " + res.text.length,
        "",
        "RAW RESPONSE BEGIN",
        res.text.slice(0, MAX_BODY),
        "RAW RESPONSE END",
        "",
        "END DEBUG BOOK-LITRES"
      );

    } catch (e) {
      lines.push(
        "FETCH ERROR",
        e && e.stack ? e.stack : String(e),
        "",
        "END DEBUG BOOK-LITRES"
      );
    }

    return JSON.stringify({
      result: lines.join("\n")
    });

  } catch (e) {
    return JSON.stringify({
      result: [
        "DEBUG BOOK-LITRES",
        "",
        "FATAL ERROR",
        e && e.stack ? e.stack : String(e),
        "",
        "END DEBUG BOOK-LITRES"
      ].join("\n")
    });
  }
};

</script>
</body>
</html>
