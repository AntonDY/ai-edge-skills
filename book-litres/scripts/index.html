<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book LitRes v6 Debug</title>
</head>
<body>
<script>
"use strict";

const TIMEOUT_MS = 20000;
const SNIPPET_LEN = 1800;

function clean(s) {
  return String(s || "").replace(/\s+/g, " ").trim();
}

function normalizeIsbn(s) {
  const value = clean(s);
  if (!value) return "";
  const bad = new Set(["n/a","na","none","null","unknown","нет","неизвестно","-"]);
  if (bad.has(value.toLowerCase())) return "";
  const compact = value.replace(/[^0-9Xx]/g, "");
  return (compact.length === 10 || compact.length === 13) ? compact : "";
}

async function fetchText(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      headers: {
        "Accept": "text/plain, text/markdown;q=0.9, text/html;q=0.8, */*;q=0.1"
      }
    });

    const text = await response.text();

    return {
      ok: response.ok,
      status: response.status,
      finalUrl: response.url || url,
      text
    };
  } finally {
    clearTimeout(timer);
  }
}

async function viaJina(url) {
  return await fetchText("https://r.jina.ai/" + url);
}

function normalizeLitresUrl(url) {
  try {
    let raw = String(url || "")
      .replace(/\\\//g, "/")
      .replace(/[)\],.;]+$/g, "");

    const u = new URL(raw);

    if (!/(^|\.)litres\.ru$/i.test(u.hostname)) return "";
    if (!/^\/book\//i.test(u.pathname)) return "";

    u.hash = "";
    u.search = "";
    u.pathname = u.pathname
      .replace(/\/reviews\/?$/i, "/")
      .replace(/\/+$/, "/");

    return u.toString();
  } catch (_) {
    return "";
  }
}

function extractLitresLinks(text) {
  const src = String(text || "");
  const found = [];
  const seen = new Set();
  let m;

  const patterns = [
    /\[([^\]]{1,300})\]\((https?:\/\/(?:www\.)?litres\.ru\/book\/[^)\s]+)\)/gi,
    /(https?:\/\/(?:www\.)?litres\.ru\/book\/[^\s)"'<>\]]+)/gi,
    /(https?:\\\/\\\/(?:www\.)?litres\.ru\\\/book\\\/[^"'\s]+)/gi
  ];

  for (let i = 0; i < patterns.length; i++) {
    while ((m = patterns[i].exec(src)) !== null) {
      let label = "";
      let raw = i === 0 ? m[2] : m[1];

      if (i === 0) label = clean(m[1]);
      raw = raw.replace(/\\\//g, "/");

      const url = normalizeLitresUrl(raw);

      if (!url || seen.has(url)) continue;

      seen.add(url);
      found.push({ label, url, pattern: i + 1 });
    }
  }

  return found;
}

function linesForLinks(links) {
  if (!links.length) return ["(none)"];
  return links.slice(0, 8).map((x, i) =>
    `${i+1}. pattern=${x.pattern} label="${x.label}" url=${x.url}`
  );
}

window["ai_edge_gallery_get_result"] = async function(data) {
  try {
    const input = typeof data === "string" ? JSON.parse(data) : data;

    const title = clean(input && input.title);
    const author = clean(input && input.author);
    const isbn = normalizeIsbn(input && input.isbn);

    const queries = [
      {
        name: "Q1_EXACT_TITLE_AUTHOR",
        q: 'site:litres.ru/book/ "' + title + '" "' + author + '"'
      },
      {
        name: "Q2_EXACT_TITLE",
        q: 'site:litres.ru/book/ "' + title + '"'
      },
      {
        name: "Q3_LOOSE",
        q: "site:litres.ru/book/ " + title + " " + author
      }
    ];

    if (isbn) {
      queries.push({
        name: "Q4_ISBN",
        q: "site:litres.ru/book/ " + isbn
      });
    }

    const out = [
      "DEBUG=BOOK_LITRES_V6",
      "TITLE=" + title,
      "AUTHOR=" + author,
      "ISBN=" + isbn,
      ""
    ];

    for (const item of queries) {
      const bingUrl =
        "https://www.bing.com/search?q=" +
        encodeURIComponent(item.q);

      out.push(
        "=== " + item.name + " ===",
        "QUERY=" + item.q,
        "BING_URL=" + bingUrl
      );

      try {
        const res = await viaJina(bingUrl);
        const links = extractLitresLinks(res.text || "");
        const lower = String(res.text || "").toLowerCase();

        out.push(
          "FETCH=OK",
          "HTTP_STATUS=" + res.status,
          "HTTP_OK=" + (res.ok ? "YES" : "NO"),
          "FINAL_URL=" + res.finalUrl,
          "RESPONSE_LENGTH=" + (res.text || "").length,
          "HAS_LITRES=" + (lower.includes("litres.ru") ? "YES" : "NO"),
          "HAS_BOOK_PATH=" + (lower.includes("/book/") ? "YES" : "NO"),
          "HAS_AUTHOR=" + (lower.includes("маркелов") ? "YES" : "NO"),
          "HAS_KUBERNETES=" + (lower.includes("kubernetes") ? "YES" : "NO"),
          "EXTRACTED_LINKS=" + links.length,
          ...linesForLinks(links),
          "SNIPPET_BEGIN",
          String(res.text || "").slice(0, SNIPPET_LEN),
          "SNIPPET_END",
          ""
        );
      } catch (e) {
        out.push(
          "FETCH=ERROR",
          "ERROR=" + (e && e.message ? e.message : String(e)),
          ""
        );
      }
    }

    out.push("END=BOOK_LITRES_V6");

    return out.join("\n");

  } catch (e) {
    return [
      "DEBUG=BOOK_LITRES_V6",
      "FATAL_ERROR=" + (e && e.message ? e.message : String(e)),
      "END=BOOK_LITRES_V6"
    ].join("\n");
  }
};

</script>
</body>
</html>
