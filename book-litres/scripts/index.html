<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book LitRes v5</title>
</head>
<body>
<script>
"use strict";

const TIMEOUT_MS = 20000;
const MAX_BOOK_EVIDENCE = 3500;
const MAX_REVIEW_EVIDENCE = 5000;

function clean(s) {
  return String(s || "").replace(/\s+/g, " ").trim();
}

function normalizeIsbn(s) {
  const value = clean(s);
  if (!value) return "";

  const bad = new Set([
    "n/a","na","none","null","unknown",
    "нет","неизвестно","-"
  ]);

  if (bad.has(value.toLowerCase())) return "";

  const compact = value.replace(/[^0-9Xx]/g, "");
  if (compact.length !== 10 && compact.length !== 13) return "";

  return compact;
}

async function fetchText(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      headers: {
        "Accept": "text/plain, text/markdown;q=0.9, text/html;q=0.8, */*;q=0.1"
      }
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    return await response.text();
  } finally {
    clearTimeout(timer);
  }
}

async function viaJina(url) {
  return await fetchText("https://r.jina.ai/" + url);
}

function normalizeLitresUrl(url) {
  try {
    let raw = String(url || "")
      .replace(/\\\//g, "/")
      .replace(/[)\],.;]+$/g, "");

    const u = new URL(raw);

    if (!/(^|\.)litres\.ru$/i.test(u.hostname)) return "";
    if (!/^\/book\//i.test(u.pathname)) return "";

    u.hash = "";
    u.search = "";

    let path = u.pathname
      .replace(/\/reviews\/?$/i, "/")
      .replace(/\/+$/, "/");

    u.pathname = path;

    return u.toString();
  } catch (_) {
    return "";
  }
}

function extractLitresLinks(text) {
  const out = [];
  const seen = new Set();
  const src = String(text || "");

  let m;

  // Markdown links
  const markdown =
    /\[([^\]]{1,300})\]\((https?:\/\/(?:www\.)?litres\.ru\/book\/[^)\s]+)\)/gi;

  while ((m = markdown.exec(src)) !== null) {
    const url = normalizeLitresUrl(m[2]);
    if (!url || seen.has(url)) continue;

    seen.add(url);
    out.push({
      label: clean(m[1]),
      url
    });
  }

  // Plain URLs
  const plain =
    /https?:\/\/(?:www\.)?litres\.ru\/book\/[^\s)"'<>\]]+/gi;

  while ((m = plain.exec(src)) !== null) {
    const url = normalizeLitresUrl(m[0]);
    if (!url || seen.has(url)) continue;

    seen.add(url);
    out.push({
      label: "",
      url
    });
  }

  // Escaped URLs
  const escaped =
    /https?:\\\/\\\/(?:www\.)?litres\.ru\\\/book\\\/[^"'\s]+/gi;

  while ((m = escaped.exec(src)) !== null) {
    const url = normalizeLitresUrl(m[0].replace(/\\\//g, "/"));
    if (!url || seen.has(url)) continue;

    seen.add(url);
    out.push({
      label: "",
      url
    });
  }

  return out;
}

function tokens(s) {
  return clean(s)
    .toLowerCase()
    .split(/[^\p{L}\p{N}]+/u)
    .filter(x => x.length >= 2);
}

function scoreCandidate(item, title, author) {
  const label = clean(item.label).toLowerCase();
  const titleTokens = tokens(title);
  const authorTokens = tokens(author);

  let score = 0;
  let tm = 0;
  let am = 0;

  for (const t of titleTokens) {
    if (label.includes(t)) {
      tm++;
      score += 10;
    }
  }

  for (const t of authorTokens) {
    if (label.includes(t)) {
      am++;
      score += 7;
    }
  }

  if (titleTokens.length && tm / titleTokens.length >= 0.7) score += 40;
  if (titleTokens.length && tm === titleTokens.length) score += 25;
  if (authorTokens.length && am > 0) score += 15;
  if (authorTokens.length && am === authorTokens.length) score += 20;

  return score;
}

async function searchBook(title, author, isbn) {
  const queries = [];

  if (title && author) {
    queries.push('site:litres.ru/book/ "' + title + '" "' + author + '"');
  }

  if (title) {
    queries.push('site:litres.ru/book/ "' + title + '"');
  }

  if (title && author) {
    queries.push("site:litres.ru/book/ " + title + " " + author);
  }

  if (isbn) {
    queries.push("site:litres.ru/book/ " + isbn);
  }

  const found = [];
  const seen = new Set();

  for (const q of queries) {
    const bing =
      "https://www.bing.com/search?q=" +
      encodeURIComponent(q);

    try {
      const text = await viaJina(bing);
      const links = extractLitresLinks(text);

      for (const link of links) {
        if (!seen.has(link.url)) {
          seen.add(link.url);
          found.push(link);
        }
      }
    } catch (_) {
      // Try next query.
    }
  }

  return found
    .map(x => ({
      ...x,
      score: scoreCandidate(x, title, author)
    }))
    .sort((a, b) => b.score - a.score);
}

function makeReviewsUrl(bookUrl) {
  return bookUrl.replace(/\/+$/, "") + "/reviews/";
}

function pickUsefulText(text, maxChars) {
  const src = String(text || "");
  const lines = src.split(/\r?\n/);

  const keep = [];
  const interesting =
    /рейтинг|оценк|отзыв|читател|звезд|звёзд|автор|назван|книга|rating|review/i;

  for (let i = 0; i < lines.length; i++) {
    const line = clean(lines[i]);
    if (!line) continue;

    if (interesting.test(line)) {
      const start = Math.max(0, i - 1);
      const end = Math.min(lines.length - 1, i + 8);

      for (let j = start; j <= end; j++) {
        const x = clean(lines[j]);
        if (x) keep.push(x);
      }
    }
  }

  const dedup = [];
  const seen = new Set();

  for (const x of keep) {
    if (!seen.has(x)) {
      seen.add(x);
      dedup.push(x);
    }
  }

  const chosen = dedup.join("\n") || src;
  return chosen.slice(0, maxChars);
}

function extractStats(text) {
  const src = clean(text);

  let rating = "";
  let ratingsCount = "";
  let reviewsCount = "";

  let m;

  m = src.match(/(?:рейтинг|rating)\D{0,25}([0-5](?:[.,]\d{1,2})?)/i);
  if (m) rating = m[1].replace(",", ".");

  m = src.match(/(\d[\d\s\u00a0]*)\s+(?:оценк(?:а|и|ок)?|ratings?)/i);
  if (m) ratingsCount = m[1].replace(/\s|\u00a0/g, "");

  m = src.match(/(\d[\d\s\u00a0]*)\s+(?:отзыв(?:а|ов)?|reviews?)/i);
  if (m) reviewsCount = m[1].replace(/\s|\u00a0/g, "");

  return {
    rating,
    ratingsCount,
    reviewsCount
  };
}

function singleLineValue(s) {
  return String(s || "").replace(/\r?\n/g, " ").trim();
}

window["ai_edge_gallery_get_result"] = async function(data) {
  try {
    const input =
      typeof data === "string"
        ? JSON.parse(data)
        : data;

    const title = clean(input && input.title);
    const author = clean(input && input.author);
    const isbn = normalizeIsbn(input && input.isbn);

    if (!title) {
      return [
        "FOUND=NO",
        "REASON=No title provided"
      ].join("\n");
    }

    const candidates = await searchBook(title, author, isbn);

    if (!candidates.length) {
      return [
        "FOUND=NO",
        "TITLE=" + singleLineValue(title),
        "AUTHOR=" + singleLineValue(author),
        "ISBN=" + singleLineValue(isbn),
        "REASON=No LitRes book URL extracted from search results"
      ].join("\n");
    }

    const best = candidates[0];
    const bookUrl = best.url;
    const reviewsUrl = makeReviewsUrl(bookUrl);

    let bookText = "";
    let reviewText = "";

    try {
      bookText = await viaJina(bookUrl);
    } catch (_) {}

    try {
      reviewText = await viaJina(reviewsUrl);
    } catch (_) {}

    const stats = extractStats(bookText + "\n" + reviewText);

    const bookEvidence = pickUsefulText(bookText, MAX_BOOK_EVIDENCE);
    const reviewEvidence = pickUsefulText(reviewText, MAX_REVIEW_EVIDENCE);

    return [
      "FOUND=YES",
      "TITLE=" + singleLineValue(title),
      "AUTHOR=" + singleLineValue(author),
      "ISBN=" + singleLineValue(isbn),
      "BOOK_URL=" + singleLineValue(bookUrl),
      "REVIEWS_URL=" + singleLineValue(reviewsUrl),
      "SEARCH_SCORE=" + best.score,
      "RATING=" + singleLineValue(stats.rating),
      "RATINGS_COUNT=" + singleLineValue(stats.ratingsCount),
      "REVIEWS_COUNT=" + singleLineValue(stats.reviewsCount),
      "BOOK_EVIDENCE_BEGIN",
      bookEvidence,
      "BOOK_EVIDENCE_END",
      "REVIEW_EVIDENCE_BEGIN",
      reviewEvidence,
      "REVIEW_EVIDENCE_END"
    ].join("\n");

  } catch (e) {
    return [
      "FOUND=NO",
      "REASON=" + singleLineValue(
        e && e.message ? e.message : String(e)
      )
    ].join("\n");
  }
};

</script>
</body>
</html>
