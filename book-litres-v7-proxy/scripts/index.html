<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Book LitRes v7 proxy</title></head><body><script>
"use strict";

const PROXY_BASE = "https://REPLACE-WITH-YOUR-WORKER.workers.dev";
const TIMEOUT_MS = 15000;

function clean(s) { return String(s || "").replace(/\s+/g, " ").trim(); }

async function get(url) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), TIMEOUT_MS);
  try {
    const r = await fetch(url, { signal: c.signal, headers: { Accept: "text/html,text/plain,*/*" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}

function normalizeBookUrl(url) {
  try {
    const u = new URL(url);
    if (!/(^|\.)litres\.ru$/i.test(u.hostname)) return "";
    if (!/^\/book\//i.test(u.pathname)) return "";
    u.search = ""; u.hash = "";
    u.pathname = u.pathname.replace(/\/reviews\/?$/i, "/").replace(/\/+$/, "/");
    return u.toString();
  } catch { return ""; }
}

function linksFromHtml(html) {
  const out = [], seen = new Set();
  const re = /href=["']([^"']*\/book\/[^"']+)["']/gi;
  let m;
  while ((m = re.exec(html)) !== null) {
    let raw = m[1];
    try { raw = new URL(raw, "https://www.litres.ru/").toString(); } catch { continue; }
    const url = normalizeBookUrl(raw);
    if (url && !seen.has(url)) { seen.add(url); out.push(url); }
  }
  return out;
}

function stripHtml(s) {
  return String(s || "")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/&quot;/gi, '"')
    .replace(/&amp;/gi, "&")
    .replace(/\s+/g, " ")
    .trim();
}

window["ai_edge_gallery_get_result"] = async (data) => {
  try {
    if (PROXY_BASE.includes("REPLACE-WITH-YOUR-WORKER")) {
      return JSON.stringify({ error: "PROXY_BASE is not configured yet." });
    }

    const x = JSON.parse(data || "{}");
    const title = clean(x.title);
    const author = clean(x.author);
    if (!title) return JSON.stringify({ error: "No title provided." });

    const q = [title, author].filter(Boolean).join(" ");
    const searchHtml = await get(PROXY_BASE + "/?mode=search&q=" + encodeURIComponent(q));
    const candidates = linksFromHtml(searchHtml);

    if (!candidates.length) {
      return JSON.stringify({ error: "No LitRes book URL found in proxied LitRes search results." });
    }

    const bookUrl = candidates[0];
    const reviewsUrl = bookUrl.replace(/\/+$/, "") + "/reviews/";

    let bookHtml = "", reviewsHtml = "";
    try { bookHtml = await get(PROXY_BASE + "/?mode=page&url=" + encodeURIComponent(bookUrl)); } catch {}
    try { reviewsHtml = await get(PROXY_BASE + "/?mode=page&url=" + encodeURIComponent(reviewsUrl)); } catch {}

    const bookText = stripHtml(bookHtml).slice(0, 5000);
    const reviewText = stripHtml(reviewsHtml).slice(0, 7000);

    return JSON.stringify({
      result: [
        "TITLE=" + title,
        "AUTHOR=" + author,
        "BOOK_URL=" + bookUrl,
        "REVIEWS_URL=" + reviewsUrl,
        "BOOK_EVIDENCE=" + bookText,
        "REVIEW_EVIDENCE=" + reviewText
      ].join("\n")
    });
  } catch (e) {
    return JSON.stringify({ error: e && e.message ? e.message : String(e) });
  }
};
</script></body></html>
