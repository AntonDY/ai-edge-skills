<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Edge Gallery Network Debug</title>
</head>
<body>
<script>
"use strict";

const TIMEOUT_MS = 12000;

async function testFetch(label, url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      headers: {
        "Accept": "text/plain, text/html;q=0.9, */*;q=0.1"
      }
    });

    let text = "";
    try {
      text = await response.text();
    } catch (_) {}

    return [
      label + "=OK",
      label + "_STATUS=" + response.status,
      label + "_LEN=" + text.length
    ].join("\n");

  } catch (e) {
    const name = e && e.name ? e.name : "Error";
    const msg = e && e.message ? e.message : String(e);

    return [
      label + "=ERR",
      label + "_ERROR=" + name + ":" + msg
    ].join("\n");
  } finally {
    clearTimeout(timer);
  }
}

window["ai_edge_gallery_get_result"] = async function(data) {
  const tests = [
    ["T1_EXAMPLE", "https://example.com/"],
    ["T2_JINA_ROOT", "https://r.jina.ai/"],
    ["T3_JINA_EXAMPLE", "https://r.jina.ai/https://example.com/"],
    ["T4_BING", "https://www.bing.com/"],
    ["T5_JINA_BING", "https://r.jina.ai/https://www.bing.com/"],
    ["T6_LITRES", "https://www.litres.ru/"],
    ["T7_JINA_LITRES", "https://r.jina.ai/https://www.litres.ru/"]
  ];

  const out = [
    "DEBUG=NETWORK",
    "SKILL=book-litres-network-debug"
  ];

  for (const [label, url] of tests) {
    out.push("URL_" + label + "=" + url);
    out.push(await testFetch(label, url));
  }

  out.push("END=NETWORK");
  return out.join("\n");
};

</script>
</body>
</html>
