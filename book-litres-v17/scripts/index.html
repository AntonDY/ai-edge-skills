<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Book LitRes v17</title></head><body><script>
"use strict";
const PROXY="https://litres-proxy-worker.adovzhenko.workers.dev";
function parseInput(data){if(data&&typeof data==='object')return data;try{return JSON.parse(String(data||'{}'));}catch{return {};}}
async function fetchJson(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});const tx=await r.text();try{return{ok:true,body:JSON.parse(tx)}}catch{return{ok:false,error:'Некорректный ответ прокси'}}}catch(e){return{ok:false,error:e&&e.name==='AbortError'?'истекло время ожидания':'не удалось связаться с прокси'}}finally{clearTimeout(t)}}
function clean(s){return String(s==null?'':s).replace(/\s+/g,' ').trim()}
function fmt(v){return v==null||v===''?'не указано':String(v).replace('.',',')}
function plural(n,one,few,many){n=Number(n);if(!Number.isFinite(n))return many;const a=n%10,b=n%100;if(a===1&&b!==11)return one;if(a>=2&&a<=4&&(b<12||b>14))return few;return many}
function answer(b){if(!b||b.ok!==true||b.found!==true)return 'Не удалось получить проверенную карточку книги на ЛитРес. Причина: '+clean(b&&(b.error||b.detail)||'неизвестная ошибка')+'.';const l=[];l.push('**Книга** — '+clean(b.title||'Название не указано')+', '+clean(b.author||'автор не указан')+(b.url?'. [Открыть на ЛитРес]('+clean(b.url)+')':'.'));l.push('');l.push('**Аннотация** — '+(b.annotation?clean(b.annotation):'на странице ЛитРес не удалось извлечь аннотацию.'));l.push('');l.push('**Оценка** — '+fmt(b.rating)+' из 5 — '+fmt(b.ratings_count)+' '+plural(b.ratings_count,'оценка','оценки','оценок')+', '+fmt(b.reviews_count)+' '+plural(b.reviews_count,'отзыв','отзыва','отзывов')+'.');l.push('');l.push('**Отзывы** —');if(Array.isArray(b.reviews)&&b.reviews.length){b.reviews.forEach((r,i)=>{const meta=[clean(r.author),clean(r.date)].filter(Boolean).join(', ');l.push((i+1)+'. '+(meta?'**'+meta+'** — ':'')+clean(r.text));});if(b.reviews_count!=null&&b.reviews.length<b.reviews_count){l.push('');l.push('Удалось извлечь '+b.reviews.length+' из '+b.reviews_count+' опубликованных отзывов.')}}else l.push('Тексты отзывов извлечь не удалось.');return l.join('\n')}
window['ai_edge_gallery_get_result']=async(data)=>{const i=parseInput(data),title=String(i.title||'').trim(),author=String(i.author||'').trim(),isbn=i.isbn==null?'':String(i.isbn).trim(),language=String(i.language||'ru').trim();if(!title&&!isbn)return JSON.stringify({result:'Не удалось определить название книги или ISBN.'});const u=new URL(PROXY+'/');u.searchParams.set('mode','book');if(title)u.searchParams.set('title',title);if(author)u.searchParams.set('author',author);if(isbn)u.searchParams.set('isbn',isbn);if(language)u.searchParams.set('language',language);const r=await fetchJson(u.toString(),20000);if(!r.ok)return JSON.stringify({result:'Не удалось получить данные ЛитРес: '+r.error+'.'});return JSON.stringify({result:answer(r.body)})};
</script></body></html>
